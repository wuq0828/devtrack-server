name: DevTrack CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: 后端编译 + 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "17"
          cache: maven
      - name: mvn test
        run: mvn -B test

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: devtrack-web/package-lock.json
      - name: build
        working-directory: devtrack-web
        run: |
          npm ci
          npm run build
