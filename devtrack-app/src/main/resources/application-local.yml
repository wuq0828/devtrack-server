spring:
  config:
    activate:
      on-profile: local

  # 本地用 H2 内存库,零基础设施;重启即清空
  datasource:
    url: jdbc:h2:mem:devtrack;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      # 本地由实体自动建表(不跑 Flyway)
      ddl-auto: update
    show-sql: false
    open-in-view: false

  flyway:
    enabled: false
